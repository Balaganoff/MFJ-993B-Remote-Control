name: Build firmware

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Prepare browser-update image
        run: cp .pio/build/esp32dev/firmware.bin MFJ993B_Remote_Control.ino.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFJ993B-Remote-Control-firmware
          path: MFJ993B_Remote_Control.ino.bin
          if-no-files-found: error
