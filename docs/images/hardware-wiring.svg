<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">MFJ-993B ESP32 remote-control wiring</title>
  <desc id="desc">LCD bus sensing through a 74LVC244A and isolated button and power control through PC817 optocouplers.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#35d878"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .box{fill:#171b1d;stroke:#4c555a;stroke-width:2;filter:url(#shadow)}
      .lcd{fill:#15271b;stroke:#2e7d46;stroke-width:3}
      .esp{fill:#13273a;stroke:#3688c9;stroke-width:3}
      .iso{fill:#2a2115;stroke:#aa7132;stroke-width:2}
      .relay{fill:#2b1717;stroke:#c65e5e;stroke-width:2}
      .h1{font:700 31px Arial,sans-serif;fill:#f1f5f3}
      .h2{font:700 23px Arial,sans-serif;fill:#e8eeeb}
      .txt{font:18px Arial,sans-serif;fill:#cbd3cf}
      .small{font:15px Arial,sans-serif;fill:#aeb8b3}
      .mono{font:17px Consolas,monospace;fill:#d8dfdc}
      .green{stroke:#35d878;stroke-width:3;fill:none}
      .blue{stroke:#58a6ff;stroke-width:3;fill:none}
      .power{stroke:#ef6a6a;stroke-width:3;fill:none}
      .ground{stroke:#8d9792;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#0d1011"/>
  <text x="800" y="54" text-anchor="middle" class="h1">MFJ-993B ↔ ESP32: подключение LCD, кнопок и питания</text>
  <text x="800" y="84" text-anchor="middle" class="small">Функциональная схема проверенной распиновки; точки на плате и полярность контактов проверяйте по своей ревизии</text>

  <!-- LCD source -->
  <rect x="45" y="125" width="360" height="385" rx="16" class="lcd"/>
  <text x="225" y="169" text-anchor="middle" class="h2">MFJ-993B / LCD1602</text>
  <text x="225" y="198" text-anchor="middle" class="small">шина 5 В, режим 4 bit</text>
  <text x="75" y="244" class="mono">LCD pin 4   RS</text>
  <text x="75" y="284" class="mono">LCD pin 6   E</text>
  <text x="75" y="324" class="mono">LCD pin 11  DB4</text>
  <text x="75" y="364" class="mono">LCD pin 12  DB5</text>
  <text x="75" y="404" class="mono">LCD pin 13  DB6</text>
  <text x="75" y="444" class="mono">LCD pin 14  DB7</text>
  <text x="75" y="482" class="small">R/W: ESP32 не считывает</text>

  <!-- Level translator -->
  <rect x="510" y="125" width="405" height="385" rx="16" class="box"/>
  <text x="712" y="169" text-anchor="middle" class="h2">74LVC244A</text>
  <text x="712" y="198" text-anchor="middle" class="small">однонаправленный буфер 5 В → 3,3 В</text>
  <text x="545" y="244" class="mono">A1 → Y1   RS</text>
  <text x="545" y="284" class="mono">A2 → Y2   E</text>
  <text x="545" y="324" class="mono">A3 → Y3   DB4</text>
  <text x="545" y="364" class="mono">A4 → Y4   DB5</text>
  <text x="545" y="404" class="mono">A5 → Y5   DB6</text>
  <text x="545" y="444" class="mono">A6 → Y6   DB7</text>
  <text x="545" y="478" class="small">VCC = 3,3 В · /OE1, /OE2 = GND</text>
  <text x="545" y="500" class="small">C1 100 нФ между VCC и GND у корпуса</text>

  <!-- ESP32 -->
  <rect x="1030" y="125" width="525" height="585" rx="16" class="esp"/>
  <text x="1292" y="169" text-anchor="middle" class="h2">ESP32 Dev Module</text>
  <text x="1065" y="244" class="mono">GPIO4   ← RS</text>
  <text x="1065" y="284" class="mono">GPIO17  ← E</text>
  <text x="1065" y="324" class="mono">GPIO25  ← DB4</text>
  <text x="1065" y="364" class="mono">GPIO18  ← DB5</text>
  <text x="1065" y="404" class="mono">GPIO19  ← DB6</text>
  <text x="1065" y="444" class="mono">GPIO23  ← DB7</text>
  <line x1="1060" y1="470" x2="1525" y2="470" stroke="#3d6886"/>
  <text x="1065" y="510" class="mono">GPIO14  → ANT</text>
  <text x="1065" y="542" class="mono">GPIO26  → C-UP</text>
  <text x="1065" y="574" class="mono">GPIO27  → L-UP</text>
  <text x="1065" y="606" class="mono">GPIO33  → AUTO</text>
  <text x="1290" y="510" class="mono">GPIO13  → MODE</text>
  <text x="1290" y="542" class="mono">GPIO2   → C-DN</text>
  <text x="1290" y="574" class="mono">GPIO5   → L-DN</text>
  <text x="1290" y="606" class="mono">GPIO21  → TUNE</text>
  <text x="1065" y="660" class="mono">GPIO32  → POWER (инверсия: LOW = ON)</text>
  <text x="1065" y="691" class="small">Питание ESP32: USB или отдельный стабилизатор</text>

  <!-- LCD paths -->
  <path d="M405 235 H510" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M405 275 H510" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M405 315 H510" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M405 355 H510" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M405 395 H510" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M405 435 H510" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M915 235 H1030" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M915 275 H1030" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M915 315 H1030" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M915 355 H1030" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M915 395 H1030" class="green" marker-end="url(#arrowGreen)"/>
  <path d="M915 435 H1030" class="green" marker-end="url(#arrowGreen)"/>

  <!-- Button isolation -->
  <rect x="45" y="605" width="725" height="350" rx="16" class="iso"/>
  <text x="407" y="649" text-anchor="middle" class="h2">8 × PC817 — параллельно физическим кнопкам</text>
  <text x="85" y="699" class="txt">Сторона ESP32</text>
  <text x="470" y="699" class="txt">Изолированная сторона MFJ</text>
  <text x="85" y="744" class="mono">GPIO → RLED → |&gt; PC817 → GND</text>
  <text x="470" y="744" class="mono">Collector ─┐</text>
  <text x="470" y="777" class="mono">           ├─ контакты кнопки</text>
  <text x="470" y="810" class="mono">Emitter ───┘</text>
  <text x="85" y="850" class="small">RLED — по току LED и CTR.</text>
  <text x="85" y="875" class="small">Для 3,3 В обычно начинают с 330–470 Ω;</text>
  <text x="85" y="900" class="small">точное значение проверить по своей схеме.</text>
  <text x="470" y="850" class="small">C/E ориентировать по измеренной</text>
  <text x="470" y="875" class="small">полярности кнопочной цепи</text>
  <text x="470" y="900" class="small">конкретной ревизии MFJ.</text>
  <path d="M1030 540 H900 V720 H770" class="blue" marker-end="url(#arrowBlue)"/>

  <!-- Power relay -->
  <rect x="835" y="770" width="720" height="260" rx="16" class="relay"/>
  <text x="1195" y="814" text-anchor="middle" class="h2">POWER: PC817 → драйвер реле → питание MFJ</text>
  <text x="875" y="862" class="mono">3,3 В → RLED → PC817 → GPIO32</text>
  <text x="875" y="894" class="small">Активный LOW: ноль на GPIO32 означает POWER ON.</text>
  <text x="875" y="936" class="mono">PC817 → Q1/MOSFET → катушка K1 + защитный диод</text>
  <text x="875" y="970" class="mono">+12…15 В ── контакты K1 ── питание MFJ-993B</text>
  <text x="875" y="1002" class="small">PC817 не должен непосредственно питать катушку обычного реле.</text>
  <path d="M1292 710 V770" class="power" marker-end="url(#arrowBlue)"/>

  <!-- Grounds and cautions -->
  <path d="M225 510 V550 H1292 V710" class="ground"/>
  <text x="615" y="573" text-anchor="middle" class="small">Общий GND нужен для тракта LCD → 74LVC244A → ESP32; сторона контактов PC817 гальванически отделена</text>
  <rect x="45" y="1048" width="1510" height="48" rx="8" fill="#351d1d" stroke="#b14e4e"/>
  <text x="800" y="1079" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffc5c5">Не подавайте 5 В с LCD прямо на ESP32. Перед монтажом отключите питание, трансивер и антенны.</text>
</svg>
